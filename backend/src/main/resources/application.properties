# URL-ul de conectare la baza de date MySQL (înlocuiește cu datele tale)
spring.datasource.url=jdbc:mysql://localhost:3306/ascb_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC


# Username-ul pentru baza de date
spring.datasource.username=fresh

# Parola pentru baza de date
spring.datasource.password=fresh

# Setare pentru Hibernate: actualizează structura bazei la pornire
spring.jpa.hibernate.ddl-auto=update

# Arată interogările SQL în consolă la rulare
spring.jpa.show-sql=true

# Dialectul Hibernate pentru MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Port backend implicit (8080)
server.port=8080



