# Development profile - in-memory H2 database so the app can run without MySQL
spring.datasource.url=jdbc:h2:mem:ascbdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate settings for H2
# Ensure Hibernate uses H2 dialect (overrides any MySQL-specific setting in application.properties)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# set server port (keep default)
server.port=8080

# Enable H2 console for debugging when running dev profile
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
